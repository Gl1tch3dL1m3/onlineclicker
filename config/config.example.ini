# RENAME THIS FILE TO "config.ini"

[Global]
# Welcome to the main server configuration file!
# Below are all the configuration variables and their usage. Don't delete any of them!
# If you don't want to set something, delete "=" and the value
#
# Example: You don't want to set SUPPORTERS.
# SUPPORTERS variable looks like this: SUPPORTERS=username1, username2
# If you want to unset it, just edit it like this: SUPPORTERS

# By the way, these words are comments (every comment starts with "#") and you can make some or delete any of them!

# Database type
# Usage: DB_TYPE=<MySQL or SQLite>
# Note: If you set this to MySQL, check .env file for DB configuration.
# Note #2: All queries are natively written in MySQL language (they are translated to SQLite), so if you can create a MySQL database, you probably should.
DB_TYPE=SQLite

[Server]

# Server name
# Usage: SERVER_NAME=<text>
# Example: SERVER_NAME=OnlineClicker Server
SERVER_NAME=OnlineClicker Server

# Server port
# Usage: PORT=<number>
# Example: PORT=20456
# Note: This is important, but you probably don't need to change it. You should probably learn more about ports!
PORT=24588

# Maximum number of players on the server
# Usage: MAX_PLAYERS=<number>
# Example: MAX_PLAYERS=20
MAX_PLAYERS

# Maximum number of players in a single lobby
# Usage: MAX_IN_LOBBY=<number>
# Example: MAX_IN_LOBBY=10
MAX_IN_LOBBY=1

# Owners (by Discord user ID or username) (spaces are ignored)
# Usage: OWNERS=<list of IDs or usernames>
# Example: OWNERS=1217343439855812710, 1514272508503789681
# Another example: OWNERS=glitchedlime, bigbadwolf69
# You CAN combine IDs and usernames! (like: OWNERS=1514272508503789681, glitchedlime)

# Note: Yes, this is my Discord user ID.
OWNERS=1217343439855812710

# Moderators (by Discord user ID or username) (spaces are ignored)
# The usage is the same as OWNERS
MODERATORS

# Supporters (by Discord user ID or username) (spaces are ignored)
# The usage is the same as OWNERS
SUPPORTERS

# Verified (by Discord user ID or username) (spaces are ignored)
# The usage is the same as OWNERS
VERIFIED=1217343439855812710, GrandmaBot

# Whether player chats should be logged
# Usage: LOG_MESSAGES=<true or false>
LOG_MESSAGES=true

[Discord]

# Discord moderator roles (by Discord role ID) (spaces are ignored)
# The usage is the same as OWNERS (no usernames!!)
# Note: Users with these roles can impose penalties on users. Server owner and admins are automatically added to mods.
MODROLES

# Discord server ID the bot is in
# Usage: DISCORD_SERVER_ID=<Role ID>
DISCORD_SERVER_ID=1224057238142849074

# (Optional) Registered role ID
# This role will be assigned when a player makes an account
# Usage: REGISTERED_ROLE_ID=<Role ID>
REGISTERED_ROLE_ID=1517988134950932502